name: release

# Publishes the scotty binaries for a tag v<version> (src/version.ts) on GitHub Releases, then
# points the brew tap's formula at them. install.sh downloads the latest release's binary.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # The macOS binaries are built, and ad-hoc signed by bun, on macOS.
    runs-on: macos-latest
    environment: release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check the tag is this version
        run: |
          version=$(sed -n 's/^export const version = "\(.*\)";$/\1/p' src/version.ts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME is not v$version (src/version.ts)" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run ui:build
      - run: npm run compile
      - name: Package
        run: |
          mkdir -p dist/out
          for platform in darwin-arm64 darwin-x64 linux-x64; do
            cp "dist/bin/scotty-$platform" dist/scotty
            tar -czf "dist/out/scotty-$platform.tar.gz" -C dist scotty
          done
          cp install.sh dist/out/install.sh
          (cd dist/out && shasum -a 256 scotty-*.tar.gz > checksums.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A rerun replaces the files of a release the first run published.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/out/* --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/out/* --title "Scotty $VERSION" \
            --notes "Install with brew install yeshwanthyk/scotty/scotty, or: curl -fsSL https://github.com/Yeshwanthyk/scotty/releases/latest/download/install.sh | sh"
      - name: Update the brew tap
        env:
          TAP_TOKEN: ${{ secrets.SCOTTY_TAP_TOKEN }}
        run: |
          sum() { awk -v f="scotty-$1.tar.gz" '$2 == f { print $1 }' dist/out/checksums.txt; }
          base="https://github.com/Yeshwanthyk/scotty/releases/download/$GITHUB_REF_NAME"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/Yeshwanthyk/homebrew-scotty.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/scotty.rb <<EOF
          class Scotty < Formula
            desc "Codex and Claude sessions in Cloudflare Containers"
            homepage "https://github.com/Yeshwanthyk/scotty"
            version "$VERSION"
            license "MIT"

            on_macos do
              on_arm do
                url "$base/scotty-darwin-arm64.tar.gz"
                sha256 "$(sum darwin-arm64)"
              end
              on_intel do
                url "$base/scotty-darwin-x64.tar.gz"
                sha256 "$(sum darwin-x64)"
              end
            end
            on_linux do
              on_intel do
                url "$base/scotty-linux-x64.tar.gz"
                sha256 "$(sum linux-x64)"
              end
            end

            depends_on "cloudflared"

            def install
              bin.install "scotty"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/scotty --version")
            end
          end
          EOF
          cd tap
          git add Formula/scotty.rb
          git -c user.name=scotty-release -c user.email=scotty-release@users.noreply.github.com \
            commit -m "scotty $VERSION"
          git push origin HEAD
