name: Release Scotty CLI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin
            architecture: arm64
            target: bun-darwin-arm64
          - platform: darwin
            architecture: x64
            target: bun-darwin-x64
          - platform: linux
            architecture: arm64
            target: bun-linux-arm64
          - platform: linux
            architecture: x64
            target: bun-linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build sole standalone terminal artifact
        env:
          SCOTTY_COMPILE_TARGET: ${{ matrix.target }}
        run: bun scripts/build/build-cli.mjs dist/release/scotty-${{ matrix.platform }}-${{ matrix.architecture }}
      - name: Verify release artifact is standalone
        run: |
          test -f dist/release/scotty-${{ matrix.platform }}-${{ matrix.architecture }}
          test "$(find dist/release -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
      - name: Smoke native compiled release artifact
        if: matrix.platform == 'linux' && matrix.architecture == 'x64'
        run: |
          test "$(dist/release/scotty-linux-x64 --version)" = "${GITHUB_REF_NAME#v}"
          dist/release/scotty-linux-x64 --build-info > /tmp/scotty-build-info.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const info = JSON.parse(readFileSync("/tmp/scotty-build-info.json", "utf8"));
            assert.equal(info.version, process.env.GITHUB_REF_NAME.slice(1));
            assert.equal(info.commit, process.env.GITHUB_SHA);
            assert.equal(info.dirty, false);
            assert.equal(info.embeddedDeployment, true);
          '
      - name: Prove native release deployment packaging in a clean room
        if: matrix.platform == 'linux' && matrix.architecture == 'x64'
        run: node scripts/check-cli-standalone-deploy.mjs dist/release/scotty-linux-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scotty-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/release/scotty-${{ matrix.platform }}-${{ matrix.architecture }}
          if-no-files-found: error

  runtime-cli:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build dedicated Linux runtime CLI
        run: bun scripts/build-runtime-cli.mjs dist/release/scotty-runtime-linux-amd64
      - name: Verify dedicated runtime CLI contract
        run: |
          set -euo pipefail
          artifact=dist/release/scotty-runtime-linux-amd64
          test -x "$artifact"
          test "$(find dist/release -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          file "$artifact" | grep -F "ELF 64-bit LSB executable, x86-64"
          test "$("$artifact" --version)" = "${GITHUB_REF_NAME#v}"
          "$artifact" --build-info > /tmp/scotty-runtime-build-info.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const info = JSON.parse(readFileSync("/tmp/scotty-runtime-build-info.json", "utf8"));
            assert.equal(info.version, process.env.GITHUB_REF_NAME.slice(1));
            assert.equal(info.commit, process.env.GITHUB_SHA);
            assert.equal(info.dirty, false);
            assert.equal(info.embeddedDeployment, false);
          '
      - name: Prove runtime CLI in the exact supported Sandbox base
        run: |
          set -euo pipefail
          artifact="$PWD/dist/release/scotty-runtime-linux-amd64"
          base_image="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const dockerfile = readFileSync("worker/container/Dockerfile", "utf8");
            const match = /^FROM (docker\.io\/cloudflare\/sandbox:[^\s]+) AS scotty-codex-server-build$/mu.exec(dockerfile);
            if (!match) throw new Error("Pinned Sandbox base image was not found.");
            process.stdout.write(match[1]);
          ')"
          docker run --rm --platform linux/amd64 --network none \
            -v "$artifact:/tmp/scotty-runtime:ro" \
            --entrypoint sh "$base_image" -c \
            'test ! -e /usr/local/bin/scotty && test "$(/tmp/scotty-runtime --version)" = "'"${GITHUB_REF_NAME#v}"'"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scotty-runtime-linux-amd64
          path: dist/release/scotty-runtime-linux-amd64
          if-no-files-found: error

  image:
    needs: [verify, runtime-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: image-release
    outputs:
      digest: ${{ steps.published-image.outputs.digest }}
      tested_image_id: ${{ steps.tested-image.outputs.id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SCOTTY_CONTAINER_IMAGE: scotty-container:release
      SCOTTY_DOCKERHUB_REPOSITORY: ${{ vars.SCOTTY_DOCKERHUB_REPOSITORY }}
      SCOTTY_IMAGE_PLATFORM: linux/amd64
      SCOTTY_IMAGE_PUBLICATION_AUTHORIZED: ${{ vars.SCOTTY_IMAGE_PUBLICATION_AUTHORIZED }}
      SCOTTY_IMAGE_REVISION: ${{ github.sha }}
    steps:
      - name: Initialize isolated Docker configuration
        run: |
          set -euo pipefail
          publish_root="$RUNNER_TEMP/scotty-image-publication"
          rm -rf "$publish_root"
          install -d -m 0700 "$publish_root" "$publish_root/.docker"
          echo "DOCKER_CONFIG=$publish_root/.docker" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - run: npm ci --no-audit --no-fund
      - name: Validate maintainer publication authorization and repository
        run: |
          test "$SCOTTY_IMAGE_PUBLICATION_AUTHORIZED" = publish-public-image
          node --input-type=module - <<'NODE'
          import {
            validateImageReleaseTag,
            validatePublicationConfig,
          } from "./scripts/make-image-release.mjs";
          validateImageReleaseTag(process.env.GITHUB_REF_NAME);
          validatePublicationConfig({
            repository: process.env.SCOTTY_DOCKERHUB_REPOSITORY,
            usernamePresent: true,
            tokenPresent: true,
          });
          NODE
      - name: Build and test release image
        run: npm run check:container-image
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scotty-runtime-linux-amd64
          path: dist/runtime-cli
      - name: Prove runtime CLI in the supported Sandbox image
        run: |
          set -euo pipefail
          artifact="$PWD/dist/runtime-cli/scotty-runtime-linux-amd64"
          chmod 0755 "$artifact"
          docker run --rm --platform "$SCOTTY_IMAGE_PLATFORM" --network none \
            -v "$artifact:/tmp/scotty-runtime:ro" \
            --entrypoint sh "$SCOTTY_CONTAINER_IMAGE" -c \
            'test ! -e /usr/local/bin/scotty && exec /tmp/scotty-runtime --build-info' \
            > "$RUNNER_TEMP/scotty-runtime-build-info.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const info = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/scotty-runtime-build-info.json", "utf8"));
            assert.equal(info.version, process.env.GITHUB_REF_NAME.slice(1));
            assert.equal(info.commit, process.env.GITHUB_SHA);
            assert.equal(info.dirty, false);
            assert.equal(info.embeddedDeployment, false);
          '
      - name: Exercise native Codex workflows against tested image
        run: npm run check:codex-native-workflows
      - name: Record tested image identity
        id: tested-image
        run: |
          tested_image_id="$(docker image inspect "$SCOTTY_CONTAINER_IMAGE" --format '{{.Id}}')"
          [[ "$tested_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "id=$tested_image_id" >> "$GITHUB_OUTPUT"
      - name: Publish tested image
        id: published-image
        env:
          HOME: ${{ runner.temp }}/scotty-image-publication
          SCOTTY_DOCKERHUB_USERNAME: ${{ secrets.SCOTTY_DOCKERHUB_USERNAME }}
          SCOTTY_DOCKERHUB_TOKEN: ${{ secrets.SCOTTY_DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SCOTTY_DOCKERHUB_USERNAME"
          test -n "$SCOTTY_DOCKERHUB_TOKEN"
          printf '%s' "$SCOTTY_DOCKERHUB_TOKEN" | docker login \
            --username "$SCOTTY_DOCKERHUB_USERNAME" --password-stdin
          published_tag="$SCOTTY_DOCKERHUB_REPOSITORY:$GITHUB_REF_NAME"
          docker tag "$SCOTTY_CONTAINER_IMAGE" "$published_tag"
          docker push --platform "$SCOTTY_IMAGE_PLATFORM" "$published_tag" \
            2>&1 | tee "$RUNNER_TEMP/scotty-image-push.log"
          digest="$(node scripts/make-image-release.mjs \
            --docker-push-digest "$RUNNER_TEMP/scotty-image-push.log")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest published image provenance
        id: attest-image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        env:
          HOME: ${{ runner.temp }}/scotty-image-publication
        with:
          subject-name: ${{ env.SCOTTY_DOCKERHUB_REPOSITORY }}
          subject-digest: ${{ steps.published-image.outputs.digest }}
          push-to-registry: true
      - name: Record image attestation receipt
        env:
          SCOTTY_IMAGE_ATTESTATION_URL: ${{ steps.attest-image.outputs.attestation-url }}
        run: |
          set -euo pipefail
          test -n "$SCOTTY_IMAGE_ATTESTATION_URL"
          printf '%s\n' "$SCOTTY_IMAGE_ATTESTATION_URL" > "$RUNNER_TEMP/scotty-image-attestation-url"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-attestation-receipt
          path: ${{ runner.temp }}/scotty-image-attestation-url
          if-no-files-found: error
          retention-days: 1
      - name: Remove publication credentials
        env:
          HOME: ${{ runner.temp }}/scotty-image-publication
        run: |
          docker logout || true
          rm -rf "$RUNNER_TEMP/scotty-image-publication"
      - name: Remove any remaining publication credentials
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then
            rm -rf "$RUNNER_TEMP/scotty-image-publication"
          fi

  image-verify:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: image-release
    permissions:
      contents: read
      attestations: read
    env:
      SCOTTY_DOCKERHUB_REPOSITORY: ${{ vars.SCOTTY_DOCKERHUB_REPOSITORY }}
      SCOTTY_IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      SCOTTY_IMAGE_PLATFORM: linux/amd64
      SCOTTY_TESTED_IMAGE_ID: ${{ needs.image.outputs.tested_image_id }}
    steps:
      - name: Initialize anonymous Docker configuration
        run: |
          set -euo pipefail
          verification_root="$RUNNER_TEMP/scotty-anonymous-verification"
          docker_config="$verification_root/.docker"
          rm -rf "$verification_root"
          install -d -m 0700 "$verification_root" "$docker_config"
          printf '%s\n' '{"auths":{}}' > "$docker_config/config.json"
          chmod 0600 "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate maintainer repository for anonymous verification
        run: |
          node --input-type=module - <<'NODE'
          import {
            validateImageReleaseTag,
            validateImageRepository,
          } from "./scripts/make-image-release.mjs";
          validateImageReleaseTag(process.env.GITHUB_REF_NAME);
          validateImageRepository(process.env.SCOTTY_DOCKERHUB_REPOSITORY);
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-attestation-receipt
          path: dist/image-attestation
      - name: Verify anonymous public pull and tested identity on a fresh runner
        id: public-image
        env:
          HOME: ${{ runner.temp }}/scotty-anonymous-verification
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const isAnonymousConfig =
            readFileSync(`${process.env.DOCKER_CONFIG}/config.json`, "utf8") === '{"auths":{}}\n';
          assert.equal(isAnonymousConfig, true, "Anonymous Docker configuration is not empty.");
          NODE
          image_ref="$SCOTTY_DOCKERHUB_REPOSITORY@$SCOTTY_IMAGE_DIGEST"
          docker pull --platform "$SCOTTY_IMAGE_PLATFORM" "$image_ref"
          public_id="$(docker image inspect "$image_ref" --format '{{.Id}}')"
          test "$public_id" = "$SCOTTY_TESTED_IMAGE_ID"
          test "$(docker image inspect "$image_ref" --format '{{.Os}}/{{.Architecture}}')" = "$SCOTTY_IMAGE_PLATFORM"
          docker image inspect "$image_ref" --format '{{json .Config.Labels}}' > "$RUNNER_TEMP/scotty-image-labels.json"
          echo "id=$public_id" >> "$GITHUB_OUTPUT"
      - name: Verify immutable image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          HOME: ${{ runner.temp }}/scotty-anonymous-verification
        run: |
          set -euo pipefail
          image_ref="$SCOTTY_DOCKERHUB_REPOSITORY@$SCOTTY_IMAGE_DIGEST"
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const isAnonymousConfig =
            readFileSync(`${process.env.DOCKER_CONFIG}/config.json`, "utf8") === '{"auths":{}}\n';
          assert.equal(isAnonymousConfig, true, "Anonymous Docker configuration is not empty.");
          NODE
          signer_workflow="${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY/.github/workflows/release-cli.yml"
          gh attestation verify "oci://$image_ref" \
            --bundle-from-oci \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer_workflow" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - name: Create image release manifest
        env:
          SCOTTY_IMAGE_LABELS_PATH: ${{ runner.temp }}/scotty-image-labels.json
          SCOTTY_IMAGE_MANIFEST_PATH: dist/image-release/scotty-image-manifest.json
          SCOTTY_PUBLIC_IMAGE_ID: ${{ steps.public-image.outputs.id }}
          SCOTTY_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SCOTTY_IMAGE_ATTESTATION_URL="$(cat dist/image-attestation/scotty-image-attestation-url)"
          export SCOTTY_IMAGE_ATTESTATION_URL
          mkdir -p dist/image-release
          node scripts/make-image-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scotty-image-manifest
          path: dist/image-release/scotty-image-manifest.json
          if-no-files-found: error
      - name: Remove anonymous pull configuration
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then
            rm -rf "$RUNNER_TEMP/scotty-anonymous-verification"
          fi

  attest:
    needs: [build, runtime-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: scotty-darwin-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: scotty-linux-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scotty-runtime-linux-amd64
          path: dist/release
      - name: Attest release executables
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/release/scotty-*

  release:
    needs: [attest, image-verify]
    runs-on: ubuntu-latest
    environment: cli-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: scotty-*
          path: dist/release
          merge-multiple: true
      - name: Sign release manifest
        env:
          SCOTTY_RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.SCOTTY_RELEASE_ED25519_PRIVATE_KEY }}
        run: |
          bun scripts/make-cli-release.mjs "${GITHUB_REF_NAME}" dist/release
          bun scripts/make-runtime-cli-release.mjs "${GITHUB_REF_NAME}" dist/release
          node scripts/make-image-release.mjs --sign-manifest dist/release/scotty-image-manifest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          awk -v version="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; found = ($2 == version); next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"
          gh release create "${GITHUB_REF_NAME}" dist/release/* --verify-tag \
            --notes-file "$RUNNER_TEMP/release-notes.md"
