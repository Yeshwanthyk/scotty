name: Release Scotty CLI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin
            architecture: arm64
            target: bun-darwin-arm64
          - platform: darwin
            architecture: x64
            target: bun-darwin-x64
          - platform: linux
            architecture: arm64
            target: bun-linux-arm64
          - platform: linux
            architecture: x64
            target: bun-linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build sole standalone terminal artifact
        env:
          SCOTTY_COMPILE_TARGET: ${{ matrix.target }}
        run: bun scripts/build-cli.mjs dist/release/scotty-${{ matrix.platform }}-${{ matrix.architecture }}
      - name: Verify release artifact is standalone
        run: |
          test -f dist/release/scotty-${{ matrix.platform }}-${{ matrix.architecture }}
          test "$(find dist/release -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
      - name: Smoke native compiled release artifact
        if: matrix.platform == 'linux' && matrix.architecture == 'x64'
        run: dist/release/scotty-linux-x64 tools list --json
      - name: Prove native release deployment packaging in a clean room
        if: matrix.platform == 'linux' && matrix.architecture == 'x64'
        run: node scripts/check-cli-standalone-deploy.mjs dist/release/scotty-linux-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scotty-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/release/scotty-${{ matrix.platform }}-${{ matrix.architecture }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    environment: cli-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: scotty-*
          path: dist/release
          merge-multiple: true
      - name: Sign release manifest
        env:
          SCOTTY_RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.SCOTTY_RELEASE_ED25519_PRIVATE_KEY }}
        run: bun scripts/make-cli-release.mjs "${GITHUB_REF_NAME}" dist/release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/release/* --verify-tag --generate-notes
