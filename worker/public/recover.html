<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#01060c" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/scotty-favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/scotty-mark-128.png" />
    <link rel="stylesheet" href="/scotty-ui.css" />
    <link rel="stylesheet" href="/auth-flow.css" />
    <title>Recover Scotty ownership</title>
  </head>
  <body class="scotty-ui auth-flow-page">
    <main class="auth-card" id="card" data-state="ready">
      <div class="auth-lockup">
        <img class="brand-mark" src="/brand/scotty-mark-128.png" alt="" />
        <span>SCOTTY / RECOVERY</span>
      </div>
      <section class="auth-form">
        <h1>Reset browser access</h1>
        <p>
          This makes this browser Scotty's new primary device. Session data, containers, backups,
          and worktrees stay intact.
        </p>
        <div class="auth-warning">
          Every existing browser credential, pairing, and transfer will be revoked. You'll need to
          pair trusted devices again.
        </div>
        <button class="button button-primary auth-submit" id="recover" type="button">
          Reset access and make this primary
        </button>
        <div class="auth-status" id="status" role="status" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="/recover.js"></script>
  </body>
</html>
