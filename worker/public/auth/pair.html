<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#01060c" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/scotty-favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/scotty-mark-128.png" />
    <link rel="stylesheet" href="/shared/styles.css" />
    <link rel="stylesheet" href="/auth/styles.css" />
    <title>Pair with Scotty</title>
  </head>
  <body class="scotty-ui auth-flow-page pair-page">
    <main class="auth-card" id="card" data-state="ready">
      <div class="auth-lockup">
        <img class="brand-mark" src="/brand/scotty-mark-128.png" alt="" />
        <span>SCOTTY / PAIR</span>
      </div>
      <section class="auth-form">
        <h1>Register this browser</h1>
        <p>
          This one-time link gives this browser its own revocable session credential. It doesn't
          expose Scotty's root recovery credential.
        </p>
        <label for="label">Device label</label>
        <input id="label" maxlength="80" autocomplete="off" />
        <button class="button button-primary auth-submit" id="pair" type="button">
          Pair this browser
        </button>
        <div class="auth-status" id="status" role="status" aria-live="polite"></div>
      </section>
      <section class="auth-success">
        <img class="auth-art" src="/brand/scotty-complete.png" alt="" />
        <h1>Browser registered</h1>
        <p>This browser can now open Scotty sessions.</p>
        <a class="button button-primary auth-submit" href="/sessions">Open sessions</a>
      </section>
    </main>
    <script type="module" src="/auth/pair.js"></script>
  </body>
</html>
