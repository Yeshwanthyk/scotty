<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050a0f" />
    <meta name="referrer" content="same-origin" />
    <title>Scotty</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/scotty-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/scotty-favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/scotty-mark-128.png" />
    <link rel="stylesheet" href="/terminal.css" />
  </head>
  <body>
    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
    <div class="app-shell">
      <aside id="workspace-rail" class="workspace-rail" aria-label="Open containers">
        <div class="rail-brand">
          <a class="brand" href="/sessions" aria-label="Scotty home">
            <img src="/brand/scotty-mark-128.png" alt="" width="28" height="28" />
            <span>SCOTTY</span>
          </a>
          <span class="sheet-title">Switch container</span>
          <button
            id="close-drawer"
            class="icon-button close-drawer"
            type="button"
            aria-label="Close container switcher"
          >
            ×
          </button>
        </div>

        <nav id="workspace-list" class="workspace-list" aria-label="Warm containers">
          <p class="rail-message">Loading open containers…</p>
        </nav>

        <div class="rail-footer">
          <a class="home-link" href="/sessions">Home</a>
        </div>
      </aside>

      <main class="terminal-workspace">
        <header class="terminal-bar">
          <button
            id="open-drawer"
            class="workspace-picker"
            type="button"
            aria-label="Open container switcher"
            aria-controls="workspace-rail"
            aria-expanded="false"
          >
            <span class="picker-copy">
              <strong id="picker-title">Loading workspace…</strong>
              <span id="picker-project">Connecting to container</span>
            </span>
            <span class="picker-chevron" aria-hidden="true">⌄</span>
          </button>
          <div class="current-context">
            <p id="current-repo" class="current-repo">Loading workspace…</p>
            <p id="current-meta" class="current-meta">Connecting to container</p>
          </div>
          <div
            id="connection-state"
            class="connection-state"
            data-state="connecting"
            role="status"
            aria-live="polite"
          >
            <span class="connection-dot" aria-hidden="true"></span>
            <span id="connection-label">Connecting</span>
          </div>
        </header>

        <section class="terminal-stage" aria-label="Pi terminal">
          <div id="terminal" class="terminal" tabindex="-1"></div>
          <div id="terminal-error" class="terminal-error" hidden>
            <p id="terminal-error-message">The terminal connection closed.</p>
            <button id="reconnect" class="reconnect-button" type="button">Reconnect</button>
          </div>
        </section>

        <form id="mobile-composer" class="mobile-composer" aria-label="Send a prompt to Pi">
          <div class="mobile-composer-entry">
            <label class="visually-hidden" for="mobile-composer-input">Message Pi</label>
            <textarea
              id="mobile-composer-input"
              class="mobile-composer-input"
              rows="1"
              enterkeyhint="send"
              autocomplete="off"
              autocapitalize="sentences"
              aria-describedby="mobile-composer-status"
              placeholder="Type a prompt…"
            ></textarea>
            <button id="mobile-composer-send" class="mobile-composer-send" type="submit" disabled>
              Send
            </button>
          </div>
          <div class="mobile-composer-tools">
            <div class="mobile-terminal-keys" role="toolbar" aria-label="Terminal keys">
              <button class="mobile-terminal-key" type="button" data-terminal-key="escape">
                Esc
              </button>
              <button class="mobile-terminal-key" type="button" data-terminal-key="tab">Tab</button>
              <button class="mobile-terminal-key" type="button" data-terminal-key="ctrl-c">
                Ctrl-C
              </button>
              <button
                class="mobile-terminal-key mobile-terminal-arrow"
                type="button"
                data-terminal-key="arrow-left"
                aria-label="Left arrow"
              >
                ←
              </button>
              <button
                class="mobile-terminal-key mobile-terminal-arrow"
                type="button"
                data-terminal-key="arrow-up"
                aria-label="Up arrow"
              >
                ↑
              </button>
              <button
                class="mobile-terminal-key mobile-terminal-arrow"
                type="button"
                data-terminal-key="arrow-down"
                aria-label="Down arrow"
              >
                ↓
              </button>
              <button
                class="mobile-terminal-key mobile-terminal-arrow"
                type="button"
                data-terminal-key="arrow-right"
                aria-label="Right arrow"
              >
                →
              </button>
            </div>
            <button id="mobile-keyboard-done" class="mobile-keyboard-done" type="button">
              Done
            </button>
          </div>
          <p id="mobile-composer-status" class="mobile-composer-status" aria-live="polite">
            Type here to see your draft instantly.
          </p>
        </form>
      </main>
    </div>

    <script type="module" src="/terminal.js"></script>
  </body>
</html>
