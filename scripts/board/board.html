<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Board</title>
    <style>
      :root {
        --bg: #f6f5f1;
        --panel: #ffffff;
        --col: #eeece6;
        --ink: #1d1c1a;
        --muted: #6d6a63;
        --line: #dedbd2;
        --accent: #2f5bd3;
        --warn: #b35c00;
        --warn-bg: #fff1e0;
        --ok: #257a3e;
        --ok-bg: #e4f4e8;
        --block: #9a2f2f;
        --block-bg: #fbe8e6;
        --code: #f1efe9;
        --shadow: 0 1px 2px rgb(0 0 0 / 6%), 0 2px 8px rgb(0 0 0 / 4%);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #141413;
          --panel: #1e1e1c;
          --col: #1a1a18;
          --ink: #ecebe6;
          --muted: #9b988f;
          --line: #2f2e2b;
          --accent: #7f9ef5;
          --warn: #f0a653;
          --warn-bg: #3a2811;
          --ok: #6fd08a;
          --ok-bg: #16301e;
          --block: #f08a80;
          --block-bg: #3a1a18;
          --code: #262624;
          --shadow: 0 1px 2px rgb(0 0 0 / 40%);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #141413;
        --panel: #1e1e1c;
        --col: #1a1a18;
        --ink: #ecebe6;
        --muted: #9b988f;
        --line: #2f2e2b;
        --accent: #7f9ef5;
        --warn: #f0a653;
        --warn-bg: #3a2811;
        --ok: #6fd08a;
        --ok-bg: #16301e;
        --block: #f08a80;
        --block-bg: #3a1a18;
        --code: #262624;
        --shadow: 0 1px 2px rgb(0 0 0 / 40%);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      code,
      pre,
      .mono {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 12.5px;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 16px 20px 8px;
      }
      h1 {
        margin: 0 8px 0 0;
        font-size: 18px;
        letter-spacing: -0.01em;
      }
      .stamp {
        color: var(--muted);
        font-size: 12px;
      }
      .spacer {
        flex: 1;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip,
      button {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 999px;
        padding: 3px 10px;
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
      }
      .chip[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      input[type="search"] {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 8px;
        padding: 5px 10px;
        font: inherit;
        width: 200px;
      }
      main {
        display: grid;
        grid-template-columns: repeat(4, minmax(220px, 1fr));
        gap: 12px;
        padding: 8px 20px 24px;
        align-items: start;
      }
      .column {
        min-width: 0;
        overflow-wrap: anywhere;
        background: var(--col);
        border-radius: 12px;
        padding: 10px;
        min-height: 120px;
      }
      .column h2 {
        margin: 2px 4px 10px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
      }
      .card {
        display: block;
        width: 100%;
        text-align: left;
        border-radius: 10px;
        padding: 9px 11px;
        margin-bottom: 8px;
        box-shadow: var(--shadow);
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .card:hover,
      .card:focus-visible {
        border-color: var(--accent);
        outline: none;
      }
      .card .top {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 2px;
      }
      .card .id {
        font-weight: 600;
        font-size: 12px;
      }
      .card .title {
        font-size: 13.5px;
      }
      .card .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 6px;
      }
      .tag {
        font-size: 11px;
        border-radius: 5px;
        padding: 0 6px;
        background: var(--code);
        color: var(--muted);
      }
      .tag.warn {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .tag.block {
        background: var(--block-bg);
        color: var(--block);
      }
      .tag.ok {
        background: var(--ok-bg);
        color: var(--ok);
      }
      .type {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex: none;
      }
      .done .card {
        opacity: 0.65;
      }
      .ready {
        border-left: 3px solid var(--ok);
      }
      dialog {
        border: none;
        padding: 0;
        margin: 0 0 0 auto;
        height: 100vh;
        max-height: 100vh;
        width: min(720px, 100vw);
        background: var(--panel);
        color: var(--ink);
        box-shadow: -8px 0 32px rgb(0 0 0 / 18%);
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 25%);
      }
      .detail {
        padding: 20px 24px 40px;
      }
      .detail h2 {
        margin: 4px 0 6px;
        font-size: 20px;
        line-height: 1.3;
      }
      .detail .bar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .detail section {
        margin-top: 18px;
      }
      .detail h3 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 6px;
      }
      .md p {
        margin: 0 0 10px;
      }
      .md ul ul {
        margin: 2px 0 4px;
      }
      .md ul {
        margin: 0 0 10px;
        padding-left: 20px;
      }
      .md code {
        background: var(--code);
        border-radius: 4px;
        padding: 0 4px;
      }
      .md a,
      .dep {
        color: var(--accent);
      }
      .dep {
        border: none;
        background: none;
        padding: 0;
        text-decoration: underline;
      }
      pre {
        background: var(--code);
        border-radius: 8px;
        padding: 12px;
        white-space: pre-wrap;
        margin: 0;
      }
      .log {
        list-style: none;
        padding: 0;
        margin: 0;
        border-left: 2px solid var(--line);
      }
      .log li {
        padding: 2px 0 8px 12px;
      }
      .log time {
        color: var(--muted);
        font-size: 12px;
        margin-right: 8px;
      }
      .cmds {
        display: grid;
        gap: 6px;
      }
      .cmd {
        display: flex;
        gap: 8px;
        align-items: center;
        background: var(--code);
        border-radius: 8px;
        padding: 6px 6px 6px 10px;
      }
      .cmd code.block {
        white-space: pre-wrap;
        align-self: stretch;
        padding: 6px 0;
      }
      .cmd code {
        flex: 1;
        overflow-wrap: anywhere;
      }
      .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .empty {
        color: var(--muted);
        font-size: 12.5px;
        padding: 4px;
      }
      @media (max-width: 900px) {
        header {
          padding: 12px 16px 4px;
        }
        main {
          grid-template-columns: 1fr;
          padding: 8px 16px 24px;
        }
        input[type="search"] {
          width: 100%;
        }
        .detail {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="name"></h1>
      <span class="stamp" id="stamp"></span>
      <span class="spacer"></span>
      <div class="chips" id="types"></div>
      <input type="search" id="q" placeholder="Filter…  ( / )" aria-label="Filter cards" />
      <button id="theme" title="Toggle theme">◐</button>
    </header>
    <main id="board"></main>
    <dialog id="panel"><div class="detail" id="detail"></div></dialog>

    <script id="data" type="application/json">
      __BOARD_DATA__
    </script>
    <script>
      const B = JSON.parse(document.getElementById("data").textContent);
      const LABELS = { backlog: "Backlog", next: "Next", doing: "In progress", done: "Done" };
      const TYPES = {
        R: ["Reliability", "#d0513a"],
        C: ["Cleanup", "#8a7f6a"],
        M: ["Model", "#7a5bd3"],
        E: ["E2E", "#2f8f83"],
        D: ["Design", "#d39a2f"],
      };
      const byId = new Map(B.cards.map((c) => [c.id, c]));
      const state = { type: "", q: "" };
      try {
        state.type = localStorage.getItem("board.type") ?? "";
        const theme = localStorage.getItem("board.theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}

      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      const el = (tag, attrs = {}, html = "") => {
        const n = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
        n.innerHTML = html;
        return n;
      };
      const blockers = (c) => c.deps.filter((d) => byId.get(d)?.column !== "done");
      const typeOf = (c) => c.id[0];

      const inline = (s) =>
        esc(s)
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2">$1</a>')
          .replace(/\b([RCMED]-\d+[a-z]?)\b/g, (m) =>
            byId.has(m) ? `<button class="dep" data-open="${m}">${m}</button>` : m,
          );
      const md = (text) => {
        const out = [];
        const depth = [];
        const close = (indent) => {
          while (depth.length && depth.at(-1) > indent) (out.push("</li></ul>"), depth.pop());
        };
        for (const raw of text.split("\n")) {
          const item = raw.match(/^(\s*)[-*] (.*)$/);
          if (item) {
            const indent = item[1].length;
            close(indent);
            if (depth.at(-1) === indent) out.push("</li>");
            else (out.push("<ul>"), depth.push(indent));
            out.push(`<li>${inline(item[2])}`);
            continue;
          }
          close(-1);
          if (raw.trim()) out.push(`<p>${inline(raw.trim())}</p>`);
        }
        close(-1);
        return out.join("");
      };

      const matches = (c) => {
        if (state.type && typeOf(c) !== state.type) return false;
        if (!state.q) return true;
        const q = state.q.toLowerCase();
        return `${c.id} ${c.title} ${c.body}`.toLowerCase().includes(q);
      };

      const cardEl = (c) => {
        const blocked = blockers(c);
        const ready = c.column === "next" && blocked.length === 0;
        const tags = [
          c.contract ? '<span class="tag warn">⚠ contract</span>' : "",
          blocked.length && c.column !== "done"
            ? `<span class="tag block">blocked · ${esc(blocked.join(", "))}</span>`
            : "",
          ready ? '<span class="tag ok">ready</span>' : "",
          c.log.length > 1 ? `<span class="tag">${c.log.length} notes</span>` : "",
          c.pr ? `<span class="tag">#${esc(c.pr)}</span>` : "",
        ].join("");
        const color = TYPES[typeOf(c)]?.[1] ?? "var(--muted)";
        return el(
          "button",
          { class: `card${ready ? " ready" : ""}`, "data-open": c.id },
          `<div class="top"><span class="type" style="background:${color}"></span><span class="id mono">${esc(c.id)}</span></div>
           <div class="title">${esc(c.title)}</div>${tags ? `<div class="meta">${tags}</div>` : ""}`,
        );
      };

      const render = () => {
        const main = document.getElementById("board");
        main.replaceChildren();
        for (const col of B.columns) {
          const cards = B.cards.filter((c) => c.column === col && matches(c));
          const node = el(
            "section",
            { class: `column ${col}` },
            `<h2><span>${LABELS[col] ?? col}</span><span>${cards.length}</span></h2>`,
          );
          if (!cards.length) node.append(el("div", { class: "empty" }, "Nothing here"));
          for (const c of cards) node.append(cardEl(c));
          main.append(node);
        }
        const chips = document.getElementById("types");
        chips.replaceChildren();
        for (const [key, [label]] of [["", ["All"]], ...Object.entries(TYPES)]) {
          const n = B.cards.filter((c) => !key || typeOf(c) === key).length;
          if (!n) continue;
          const chip = el(
            "button",
            { class: "chip", "aria-pressed": String(state.type === key), "data-type": key },
            `${label} <span style="opacity:.6">${n}</span>`,
          );
          chips.append(chip);
        }
      };

      const cmd = (text, primary) =>
        `<div class="cmd"><code${primary ? ' class="block"' : ""}>${esc(text)}</code><button class="${primary ? "primary" : ""}" data-copy>Copy</button></div>`;

      const open = (id) => {
        const c = byId.get(id);
        if (!c) return;
        const blocked = blockers(c);
        const deps = c.deps.length
          ? c.deps
              .map((d) => {
                const other = byId.get(d);
                const cls = other?.column === "done" ? "ok" : "block";
                return `<span class="tag ${cls}"><button class="dep" data-open="${esc(d)}">${esc(d)}</button> · ${esc(LABELS[other?.column] ?? "missing")}</span>`;
              })
              .join(" ")
          : '<span class="empty">None</span>';
        const log = c.log.length
          ? `<ol class="log">${c.log
              .map((e) => `<li><time>${esc(e.at)}</time>${inline(e.note)}</li>`)
              .join("")}</ol>`
          : '<span class="empty">No notes yet</span>';
        const r = B.run;
        document.getElementById("detail").innerHTML = `
          <div class="bar">
            <span class="type" style="background:${TYPES[typeOf(c)]?.[1]}"></span>
            <span class="mono">${esc(c.id)}</span>
            <span class="tag">${esc(LABELS[c.column])}</span>
            ${c.contract ? '<span class="tag warn">⚠ contract change: confirm first</span>' : ""}
            ${blocked.length && c.column !== "done" ? `<span class="tag block">blocked</span>` : ""}
            ${c.pr ? `<span class="tag">PR #${esc(c.pr)}</span>` : ""}
            <span class="spacer"></span>
            <button data-close>Close</button>
          </div>
          <h2>${esc(c.title)}</h2>
          <section><h3>Depends on</h3>${deps}</section>
          <section class="md">${md(c.body || "No body yet.")}</section>
          <section><h3>Handoff log</h3>${log}</section>
          <section><h3>Start a session</h3>
            <div class="cmds">${cmd(B.prompts[c.id], true)}</div>
          </section>
          <section><h3>Commands</h3><div class="cmds">
            ${cmd(`${r} start ${c.id}`)}
            ${cmd(`${r} log ${c.id} "done: …; next: …; open: …"`)}
            ${cmd(`${r} done ${c.id} --pr `)}
          </div></section>`;
        const dialog = document.getElementById("panel");
        if (!dialog.open) dialog.showModal();
        dialog.scrollTop = 0;
        try {
          history.replaceState(null, "", `#${c.id}`);
        } catch {}
      };

      document.addEventListener("click", async (e) => {
        const t = e.target.closest("[data-open],[data-copy],[data-type],[data-close]");
        if (e.target.id === "panel") return document.getElementById("panel").close();
        if (!t) return;
        if (t.dataset.open) return open(t.dataset.open);
        if (t.hasAttribute("data-close")) return document.getElementById("panel").close();
        if (t.dataset.type !== undefined) {
          state.type = t.dataset.type;
          try {
            localStorage.setItem("board.type", state.type);
          } catch {}
          return render();
        }
        if (t.dataset.copy !== undefined) {
          const text = t.closest(".cmd").querySelector("code").textContent;
          await navigator.clipboard.writeText(text);
          const label = t.textContent;
          t.textContent = "Copied";
          setTimeout(() => (t.textContent = label), 1200);
        }
      });
      document.getElementById("panel").addEventListener("close", () => {
        try {
          history.replaceState(null, "", location.pathname);
        } catch {}
      });
      document.getElementById("q").addEventListener("input", (e) => {
        state.q = e.target.value.trim();
        render();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
          e.preventDefault();
          document.getElementById("q").focus();
        }
      });
      document.getElementById("theme").addEventListener("click", () => {
        const root = document.documentElement;
        const dark =
          root.dataset.theme === "dark" ||
          (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
        root.dataset.theme = dark ? "light" : "dark";
        try {
          localStorage.setItem("board.theme", root.dataset.theme);
        } catch {}
      });

      document.title = `${B.name} board`;
      document.getElementById("name").textContent = B.name;
      document.getElementById("stamp").textContent =
        `rendered ${new Date(B.renderedAt).toLocaleString()}`;
      render();
      if (location.hash) open(decodeURIComponent(location.hash.slice(1)));
    </script>
  </body>
</html>
