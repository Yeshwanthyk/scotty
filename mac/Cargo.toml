[package]
name = "scotty-mac"
version = "0.1.0"
edition = "2024"
publish = false
description = "Scotty for macOS, drawn with Rune"

[[bin]]
name = "scotty-mac"
path = "src/main.rs"

[dependencies]
# Rune is pre-release: pin a commit of `dev`, which is never rewritten.
rune = { git = "https://github.com/anomalyco/rune", rev = "59f0326b8a12f360736e5ca29a09fad29ad73d71" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "59f0326b8a12f360736e5ca29a09fad29ad73d71", features = [
  "markdown",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Signing in through Cloudflare Access (src/signin.rs): HTTP, the sealed token hand-off, the
# metadata JWT's signature, and the Keychain.
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
crypto_box = { version = "0.9", features = ["std", "salsa20"] }
base64 = "0.22"
jsonwebtoken = { version = "9", default-features = false }
security-framework = "3"
# Local time for the sidebar's day groups (src/time.rs).
libc = "0.2"

[features]
hot = ["rune/hot"]

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
codegen-units = 16
incremental = true
